name: Delivery
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to configured production VPS after publishing images
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: production-delivery
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: brewlite_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U brewlite -d brewlite_test" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://brewlite:ci-only-password@localhost:5432/brewlite_test?schema=public
      JWT_SECRET: ci-only-secret-not-for-production-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:int
      - run: npm run build
  images:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: {app: [api, web]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase registry path
        run: echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ env.PREFIX }}-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
  deploy:
    if: inputs.deploy == true || (startsWith(github.ref, 'refs/tags/') && vars.PRODUCTION_ENABLED == 'true')
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Validate deployment configuration
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
      - uses: actions/checkout@v4
      - name: Deploy pinned images with migration and smoke checks
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          scp docker-compose.production.yml "$DEPLOY_USER@$DEPLOY_HOST:/opt/brewlite/docker-compose.production.yml"
          scp deploy/Caddyfile deploy/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:/opt/brewlite/deploy/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd /opt/brewlite && bash deploy/deploy.sh '${{ github.sha }}'"
